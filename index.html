<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#140d1f" />
  <meta name="description" content="Simbiosa Economy — dunia ekonomi, petualangan, dan komunitas di bawah Simbiosa Society." />
  <meta property="og:title" content="🎃 Simbiosa Economy — Halloween Edition" />
  <meta property="og:description" content="Dunia ekonomi, petualangan, dan komunitas di bawah Simbiosa Society. IP: play.simbiosa.my.id" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/Logo_Simbiosa_Eco.png" />
  <title>🎃 Simbiosa Economy — Halloween Edition</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('simbiosa-theme');
        if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <link rel="icon" href="assets/Logo_Simbiosa_Eco.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #140d1f;
      --bg-soft: #1a1128;
      --panel: #1f1530;
      --panel-solid: #1f1530;
      --panel-hover: #291b3e;
      --line: rgba(240, 225, 255, .13);
      --text: #f1e8dc;
      --muted: #ad9fc0;
      --accent: #ff8a2b;
      --accent-strong: #ff8a2b;
      --accent-dark: #4a2406;
      --green-ink: #1a0d02;
      --hill: #8a5cd0;
      --shadow: none;
      --nav-bg: #140d1f;
    }
    html[data-theme="light"] {
      color-scheme: light;
      --bg: #f7ecdc;
      --bg-soft: #f0e1cb;
      --panel: #fff8ec;
      --panel-solid: #fff8ec;
      --panel-hover: #f8ecd8;
      --line: rgba(60, 30, 10, .18);
      --text: #2a1608;
      --muted: #7a5f4c;
      --accent: #c2500a;
      --accent-strong: #c2500a;
      --accent-dark: #fbe3cd;
      --green-ink: #ffffff;
      --hill: #c98a52;
      --shadow: none;
      --nav-bg: #f7ecdc;
    }
    * { box-sizing: border-box; }
    /* Scrollbar transparan */
    html { scrollbar-width: thin; scrollbar-color: rgba(255, 138, 43, .35) transparent; }
    html[data-theme="light"] { scrollbar-color: rgba(194, 80, 10, .35) transparent; }
    @supports selector(::-webkit-scrollbar) {
      html { scrollbar-width: auto; scrollbar-color: auto; }
      ::-webkit-scrollbar { width: 10px; height: 10px; background: transparent; }
      ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255, 138, 43, .3); border-radius: 0; border: 2px solid transparent; background-clip: padding-box; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255, 138, 43, .6); background-clip: padding-box; }
      html[data-theme="light"] ::-webkit-scrollbar-thumb { background: rgba(194, 80, 10, .3); background-clip: padding-box; }
      html[data-theme="light"] ::-webkit-scrollbar-thumb:hover { background: rgba(194, 80, 10, .6); background-clip: padding-box; }
    }
    html { scroll-behavior: smooth; scroll-padding-top: 96px; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Instrument Sans", system-ui, sans-serif;
      transition: background .35s ease, color .35s ease;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    img { display: block; max-width: 100%; }
    .wrap { width: min(1160px, calc(100% - 44px)); margin-inline: auto; }
    .section { padding: 100px 0; position: relative; }
    .section-heading { display: flex; justify-content: space-between; align-items: end; gap: 32px; margin-bottom: 34px; }
    .section-heading h2 { font: 700 clamp(30px, 4.6vw, 46px)/1.05 "Bricolage Grotesque", sans-serif; letter-spacing: -.025em; margin: 0; }
    .section-heading p { max-width: 420px; color: var(--muted); line-height: 1.7; margin: 0; font-size: 15px; }
    .accent-text { color: var(--accent); }

    /* Navigation */
    .site-header { position: sticky; top: 0; z-index: 50; border-bottom: 1px solid var(--line); background: var(--nav-bg); }
    .nav-inner { display: flex; align-items: center; justify-content: space-between; gap: 24px; min-height: 78px; }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 220px; }
    .brand img { width: 43px; height: 43px; object-fit: contain; }
    .brand-name { font: 700 21px/1 "Bricolage Grotesque", sans-serif; letter-spacing: .015em; }
    .brand-sub { color: var(--muted); font-size: 10px; letter-spacing: .02em;  margin-top: 4px; }
    .nav-links { display: flex; align-items: center; gap: 27px; margin-left: auto; }
    .nav-links a { color: var(--muted); font-size: 13.5px; font-weight: 600; transition: color .2s ease; }
    .nav-links a:hover, .nav-links a.active { color: var(--accent); }
    .nav-actions { display: flex; align-items: center; gap: 10px; }
    .theme-toggle, .mobile-toggle { width: 41px; height: 41px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--text); display: grid; place-items: center; transition: transform .2s, border-color .2s, background .2s; }
    .theme-toggle:hover, .mobile-toggle:hover { border-color: var(--accent); }
    .theme-toggle svg, .mobile-toggle svg { width: 18px; height: 18px; }
    .mobile-toggle { display: none; }
    .btn { min-height: 46px; display: inline-flex; justify-content: center; align-items: center; gap: 10px; padding: 0 19px; border: 1px solid transparent; border-radius: 5px; font-weight: 700; font-size: 13.5px; transition: transform .2s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease; }
    .btn:hover { filter: brightness(1.08); }
    .btn-primary { background: var(--accent); color: var(--green-ink); }
    .btn-primary:hover { }
    .btn-secondary { border-color: var(--line); color: var(--text); background: var(--panel); }
    .btn-secondary:hover { border-color: var(--accent); background: var(--panel-hover); }
    .btn svg { width: 16px; height: 16px; }

    /* Hero */
    .hero { min-height: 670px; padding: 74px 0 50px; display: flex; align-items: center; isolation: isolate; }
    .hero-grid { display: grid; grid-template-columns: 1.05fr .95fr; align-items: center; gap: 20px; }
    .hero-copy { position: relative; z-index: 2; padding-bottom: 14px; }
    .hero h1 { margin: 0; font: 700 clamp(46px, 6.2vw, 82px)/1 "Bricolage Grotesque", sans-serif; letter-spacing: -.035em; max-width: 9em; }
    .hero-desc { color: var(--muted); font-size: 15.5px; line-height: 1.85; max-width: 470px; margin: 27px 0 26px; }
    .hero-buttons { display: flex; flex-wrap: wrap; gap: 11px; }
    .ip-card { margin-top: 33px; padding: 14px; width: min(100%, 405px); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: flex; justify-content: space-between; align-items: center; gap: 13px; box-shadow: var(--shadow); }
    .ip-title { font-size: 10.5px; color: var(--muted); letter-spacing: .11em;  margin-bottom: 7px; }
    .ip-address { font: 700 18px/1 "Bricolage Grotesque", sans-serif; letter-spacing: .02em; }
    .ip-port { display: block; font-size: 12px; color: var(--muted); margin-top: 7px; }
    .copy-ip { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 0; border-radius: 5px; background: var(--accent); color: var(--green-ink); min-height: 44px; padding: 0 14px; font-size: 12.5px; font-weight: 700; }
    .copy-ip svg { width: 15px; height: 15px; }
    .hero-art { position: relative; display: grid; place-items: center; min-height: 510px; }
    .hero-art img { position: relative; width: min(97%, 510px); object-fit: contain; z-index: 1; }

    /* Features */
    .feature-strip { padding: 18px 0; border-block: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 75%, transparent); }
    .feature-grid { display: grid; grid-template-columns: repeat(3, 1fr); }
    .feature-item { display: flex; align-items: center; gap: 13px; padding: 10px 24px; border-right: 1px solid var(--line); }
    .feature-item:first-child { padding-left: 0; }
    .feature-item:last-child { border-right: 0; }
    .feature-item strong { font: 700 17px/1 "Bricolage Grotesque", sans-serif; display: block; }
    .feature-item small { color: var(--muted); font-size: 12px; display: block; margin-top: 5px; }

    /* Society */
    .society-section { padding-top: 95px; }
    .society-card { position: relative; display: grid; grid-template-columns: .85fr 1.15fr; align-items: center; overflow: hidden; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); box-shadow: var(--shadow); }
    .society-copy { padding: clamp(28px, 5vw, 55px); position: relative; z-index: 1; }
    .society-pixel-logo { width: min(220px, 80%); max-height: 118px; object-fit: contain; object-position: left center; margin-bottom: 16px; }
    .society-copy h2 { font: 700 clamp(30px, 3.8vw, 42px)/1.08 "Bricolage Grotesque", sans-serif; margin: 17px 0; letter-spacing: -.03em; }
    .society-copy p { color: var(--muted); font-size: 14.5px; line-height: 1.85; margin: 0 0 23px; }
    .society-visual { align-self: stretch; min-height: 310px; display: flex; align-items: center; justify-content: center; padding: 17px; position: relative; background: #020503; overflow: hidden; }
    .society-visual img { width: 100%; object-fit: contain; position: relative; transition: transform .8s ease; }
    .society-card:hover .society-visual img { }

    /* Store */
    .store-tools { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin-bottom: 27px; flex-wrap: wrap; }
    .category-tabs { display: flex; gap: 7px; flex-wrap: wrap; padding: 5px; border: 1px solid var(--line); background: var(--panel); border-radius: 5px; }
    .category-tab { border: 0; border-radius: 5px; background: transparent; color: var(--muted); font-size: 12.5px; font-weight: 700; padding: 11px 14px; transition: all .2s ease; }
    .category-tab:hover { color: var(--text); }
    .category-tab.active { background: var(--accent); color: var(--green-ink); }
    .search-wrap { position: relative; min-width: min(100%, 230px); }
    .search-wrap svg { width: 16px; height: 16px; position: absolute; top: 50%; left: 14px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .search-input { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 5px; padding: 0 14px 0 39px; outline: none; color: var(--text); background: var(--panel); font-size: 13.5px; transition: border-color .2s ease, box-shadow .2s ease; }
    .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent); }
    .product-grid { display: block; }
    .product-card { min-height: 235px; display: flex; flex-direction: column; padding: 19px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); position: relative; overflow: hidden; transition: transform .25s ease, border-color .25s ease, background .25s ease, box-shadow .25s ease; animation: riseIn .38s both; }
    .product-card:hover { border-color: color-mix(in srgb, var(--accent) 48%, var(--line)); background: var(--panel-hover); }
    @keyframes riseIn { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: translateY(0); } }
    .product-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; position: relative; z-index: 1; }
    .product-type { font-size: 9.5px; font-weight: 700; letter-spacing: .09em;  border-radius: 5px; padding: 7px 8px; background: color-mix(in srgb, var(--accent) 9%, transparent); color: var(--accent); }
    .product-card h3 { font: 700 22px/1 "Bricolage Grotesque", sans-serif; margin: 21px 0 8px; position: relative; z-index: 1; }
    .product-card .product-description { font-size: 12.5px; color: var(--muted); line-height: 1.65; margin: 0; min-height: 41px; position: relative; z-index: 1; }
    .product-bottom { border-top: 1px solid var(--line); margin-top: auto; padding-top: 15px; display: flex; align-items: end; justify-content: space-between; gap: 10px; position: relative; z-index: 1; }
    .product-price { font: 700 22px/1 "Bricolage Grotesque", sans-serif; letter-spacing: -.02em; white-space: nowrap; }
    .product-price-label { font-size: 10.5px; color: var(--muted); margin-bottom: 5px; }
    .product-buy { border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 5px; width: 39px; height: 39px; display: grid; place-items: center; flex: 0 0 auto; transition: .2s ease; }
    .product-buy svg { width: 17px; height: 17px; }
    .product-buy:hover { background: var(--accent); color: var(--green-ink); border-color: var(--accent); }
    .store-note { margin-top: 22px; border: 1px dashed var(--line); border-radius: 5px; padding: 13px 15px; color: var(--muted); font-size: 12.5px; line-height: 1.7; display: flex; gap: 10px; align-items: flex-start; }
    .store-note svg { width: 17px; height: 17px; color: var(--accent); flex: 0 0 auto; margin-top: 1px; }
    .empty-state { padding: 42px; border-radius: 8px; border: 1px dashed var(--line); color: var(--muted); text-align: center; grid-column: 1 / -1; }

    /* Team */
    .team-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }

    /* Community / footer */
    .community-section { padding-top: 72px; }
    .community-panel { border-radius: 8px; padding: clamp(27px, 5vw, 55px); background: var(--panel); border: 1px solid var(--line); position: relative; overflow: hidden; }
    .community-top { display: flex; align-items: end; justify-content: space-between; gap: 30px; position: relative; z-index: 1; }
    .community-top h2 { font: 700 clamp(30px, 4.6vw, 46px)/1.05 "Bricolage Grotesque", sans-serif; margin: 14px 0; max-width: 620px; }
    .community-top p { color: var(--muted); max-width: 450px; font-size: 14.5px; line-height: 1.8; margin: 0; }
    .social-grid { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 33px; }
    .social-card { padding: 17px; border: 1px solid var(--line); border-radius: 5px; background: color-mix(in srgb, var(--bg) 35%, var(--panel)); display: flex; align-items: center; justify-content: space-between; gap: 13px; transition: transform .2s, border-color .2s, background .2s; }
    .social-card:hover { border-color: var(--accent); background: var(--panel-hover); }
    .social-main { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .social-name { font: 700 19px/1 "Bricolage Grotesque", sans-serif; margin-bottom: 4px; }
    .social-detail { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
    .social-arrow { color: var(--accent); font-size: 20px; }
    .site-footer { padding: 28px 0 30px; border-top: 1px solid var(--line); }
    .footer-inner { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .footer-brand { display: flex; align-items: center; gap: 10px; }
    .footer-brand img { width: 35px; height: 35px; object-fit: contain; }
    .footer-brand strong { display: block; font: 700 18px/1 "Bricolage Grotesque", sans-serif; }
    .footer-brand small { display: block; color: var(--muted); font-size: 11px; margin-top: 4px; }
    .footer-copy { color: var(--muted); font-size: 12px; line-height: 1.7; text-align: right; }
    .footer-copy a { color: var(--accent); font-weight: 700; }
    .back-top { position: fixed; bottom: 20px; right: 20px; width: 43px; height: 43px; border: 1px solid var(--line); border-radius: 5px; display: grid; place-items: center; color: var(--text); background: var(--panel-solid); box-shadow: var(--shadow); opacity: 0; pointer-events: none; transform: translateY(8px); transition: .25s ease; z-index: 20; }
    .back-top.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .back-top svg { width: 18px; height: 18px; }

    /* Modal + toast */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, .64); display: grid; place-items: center; padding: 20px; z-index: 100; opacity: 1; transition: opacity .2s ease; }
    .modal-backdrop[hidden] { display: none; }
    .purchase-modal { width: min(100%, 470px); padding: 27px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-solid); position: relative; animation: modalIn .2s ease; }
    @keyframes modalIn { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .modal-close { position: absolute; top: 15px; right: 15px; width: 33px; height: 33px; border-radius: 5px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 19px; }
    .purchase-modal h3 { font: 700 28px/1.1 "Bricolage Grotesque", sans-serif; margin: 0 40px 10px 0; }
    .purchase-modal p { color: var(--muted); font-size: 13.5px; line-height: 1.8; }
    .modal-product { border: 1px solid var(--line); background: var(--panel); border-radius: 5px; padding: 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 19px 0; }
    .modal-product strong { font: 700 20px/1 "Bricolage Grotesque", sans-serif; display: block; }
    .modal-product small { font-size: 12px; color: var(--muted); display: block; margin-top: 5px; }
    .modal-price { font: 700 24px/1 "Bricolage Grotesque", sans-serif; white-space: nowrap; color: var(--accent); }
    .modal-actions { display: flex; flex-wrap: wrap; gap: 9px; }
    .modal-actions .btn { flex: 1; min-width: 145px; }
    .toast { position: fixed; z-index: 150; bottom: 23px; left: 50%; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--accent); color: var(--green-ink); font-size: 13.5px; font-weight: 700; padding: 12px 17px; border-radius: 5px; box-shadow: var(--shadow); transition: all .25s ease; max-width: calc(100% - 32px); text-align: center; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }


    /* Store v2: grouped catalog */
    .store-group + .store-group { margin-top: 44px; }
    .group-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-bottom: 14px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
    .group-head h3 { font: 700 28px/1 "Bricolage Grotesque", sans-serif; margin: 0; letter-spacing: -.01em; }
    .group-head p { margin: 0; color: var(--muted); font-size: 13px; text-align: right; }
    .coin-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .rank-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; }
    .product-card.coin-card { min-height: 0; animation: none; }
    .coin-card { padding: 18px; flex-direction: row; align-items: center; justify-content: space-between; gap: 14px; }
    .coin-amount { display: flex; align-items: center; gap: 14px; position: relative; z-index: 1; min-width: 0; }
    .coin-amount strong { display: block; font: 700 26px/1 "Bricolage Grotesque", sans-serif; }
    .coin-amount small { display: block; margin-top: 5px; font-size: 12px; color: var(--muted); }
    .coin-buy { display: flex; align-items: center; gap: 12px; position: relative; z-index: 1; }
    .rank-row { display: grid; grid-template-columns: 1fr auto 39px; align-items: center; gap: 16px; padding: 13px 4px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .2s ease, padding .2s ease; }
    .rank-row:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); padding-inline: 12px; border-radius: 5px; }
    .rank-name strong { display: block; font: 700 22px/1 "Bricolage Grotesque", sans-serif; }
    .rank-name small { display: block; margin-top: 4px; font-size: 12px; color: var(--muted); }
    .rank-price { font: 700 21px/1 "Bricolage Grotesque", sans-serif; white-space: nowrap; }

    /* Team v2: player cards */
    .skin-card { position: relative; display: flex; flex-direction: column; align-items: center; padding: 18px 8px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); text-align: center; overflow: hidden; transition: transform .25s ease, border-color .25s ease; }
    .skin-card:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
    .skin-card.featured { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
    .nametag { position: relative; z-index: 1; padding: 4px 10px; background: rgba(0, 0, 0, .55); color: #fff; font: 600 13px/1.3 "Instrument Sans", sans-serif; letter-spacing: .01em; max-width: 100%; overflow-wrap: anywhere; }
    .skin { position: relative; z-index: 1; height: 196px; margin-top: 14px; display: flex; align-items: flex-end; justify-content: center; }
    .skin img { height: 100%; width: auto; max-width: 100%; object-fit: contain; image-rendering: pixelated; transition: transform .3s ease; }
    .skin-card:hover .skin img { }
    .skin .avatar-fallback { width: 96px; height: 100%; font-size: 44px; }
    .plinth { position: relative; z-index: 1; width: 78%; height: 10px; margin-top: -4px; border-radius: 50%; background: radial-gradient(ellipse, rgba(0, 0, 0, .35), transparent 70%); }
    .skin-role { position: relative; z-index: 1; margin-top: 14px; padding: 6px 10px; border-radius: 5px; background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); font-size: 12px; font-weight: 700; }
    .skin-nick { position: relative; z-index: 1; margin-top: 8px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }


    /* Theme switch: sunrise / nightfall */
    .sky-layer { position: fixed; inset: 0; z-index: 130; pointer-events: none; view-transition-name: sky-layer; }
    .sky-layer canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
    html.theme-switching *:not(.theme-toggle):not(.theme-toggle *), html.theme-switching *::before, html.theme-switching *::after { transition: none !important; }
    ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
    ::view-transition-old(root) { z-index: 1; }
    ::view-transition-new(root) { z-index: 2; clip-path: var(--sky-clip, none); }
    ::view-transition-group(sky-layer) { animation: none; }
    ::view-transition-old(sky-layer) { display: none; }
